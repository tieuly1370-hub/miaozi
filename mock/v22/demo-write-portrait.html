<div class="app">
  <main class="main p-write">
    <section class="col-write">
      <div class="write-head">
        <div>
          <span class="h-title">Viết theo nét</span>
          <span class="tiny" style="margin-left:10px">Từ 4/13 · 好</span>
        </div>
        <div class="sel">Bài 1 ▾</div>
      </div>
      <div class="tiles" aria-label="Lưới chữ của bài">
<div class="tile" title="你">你</div>
<div class="tile is-now" title="好">好</div>
<div class="tile" title="王">王</div>
<div class="tile" title="老">老</div>
<div class="tile" title="师">师</div>
<div class="tile" title="大">大</div>
<div class="tile" title="家">家</div>
<div class="tile" title="学">学</div>
<div class="tile" title="生">生</div>
<div class="tile" title="们">们</div>
<div class="tile is-miss" title="您">您</div>
<div class="tile is-miss" title="谢">谢</div>
<div class="tile" title="不">不</div>
<div class="tile" title="客">客</div>
<div class="tile" title="气">气</div>
<div class="tile" title="同">同</div>
<div class="tile" title="再">再</div>
<div class="tile is-miss" title="见">见</div>
</div>
      <div class="write-stage">
        
      <div class="mizi-wrap">
        <div class="mizi" aria-label="Ô viết chữ 好, lưới mễ">
          <svg class="rice" viewBox="0 0 408 408" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <rect x="0.5" y="0.5" width="407" height="407" stroke="#D2C3CB" stroke-opacity="0.85"/>
  <line x1="204" y1="0" x2="204" y2="408" stroke="#D2C3CB" stroke-dasharray="5 6" stroke-opacity="0.9"/>
  <line x1="0" y1="204" x2="408" y2="204" stroke="#D2C3CB" stroke-dasharray="5 6" stroke-opacity="0.9"/>
  <line x1="0" y1="0" x2="408" y2="408" stroke="#D2C3CB" stroke-dasharray="5 6" stroke-opacity="0.75"/>
  <line x1="408" y1="0" x2="0" y2="408" stroke="#D2C3CB" stroke-dasharray="5 6" stroke-opacity="0.75"/>
</svg>
          <img class="glyph" src="char-hao.svg" alt="chữ 好, đã viết bộ 女">
        </div>
        <div class="mizi-actions">
          <button class="btn btn-ghost">Nghe</button>
          <button class="btn btn-ghost">Xem nét mẫu</button>
          <button class="btn btn-pink">Viết lại</button>
        </div>
      </div>

        
      <aside class="info card">
        <div class="big hz">好</div>
        <div class="meta">
          <div class="py-lg">hǎo</div>
          <div class="vi-lg">Tốt, khỏe, được</div>
          <div class="hv">Hán Việt: hảo</div>
        </div>
        <hr>
        <div class="compose">
          <div class="block-label">Cấu tạo</div>
          <div class="parts">
            <div class="part is-accent">
              <span class="p-hz">女</span>
              <span class="p-meta"><b>nữ</b><span>người nữ</span></span>
            </div>
            <span class="plus">+</span>
            <div class="part">
              <span class="p-hz">子</span>
              <span class="p-meta"><b>tử</b><span>con</span></span>
            </div>
          </div>
        </div>
        <div class="mnemonic">
          <div class="block-label">Mẹo nhớ</div>
          <p class="note">Có mẹ có con — điều tốt đẹp.</p>
          <p class="note-story" style="margin-top:8px">Mẹ (女) dắt con (子) đi cạnh nhau, nhìn là thấy điều tốt. Nhớ “nữ + tử = hảo”.</p>
        </div>
      </aside>

      </div>
    </section>
  </main>
